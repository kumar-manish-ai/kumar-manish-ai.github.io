<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Enterprise GenAI and Agentic AI Platform — conceptual architecture</title><desc id="desc">A conceptual architecture showing user applications connecting to an agent orchestration layer, AWS Bedrock model capabilities, RAG knowledge retrieval, MCP integrations and enterprise data and action systems.</desc>
