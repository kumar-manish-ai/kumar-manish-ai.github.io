text{font-family:Inter,Arial,sans-serif}.title{font-size:34px;font-weight:750;fill:#f4f7fb;letter-spacing:-1px}.sub{font-size:15px;fill:#aebed0}.label{font-size:13px;letter-spacing:1.5px;font-weight:700;fill:#8ea4ba}.boxTitle{font-size:19px;font-weight:700;fill:#f5f8fc}.boxSub{font-size:13px;fill:#b5c4d5}.tiny{font-size:12px;fill:#9eb0c3}.mint{fill:#9cf0d2}.stroke{stroke:#83d9bb;stroke-width:3;fill:none;marker-end:url(#arrow)}
</style></defs>
